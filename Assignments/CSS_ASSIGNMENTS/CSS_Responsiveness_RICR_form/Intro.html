<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> CSS Responsiveness RICR form </title>
    <link rel="stylesheet" href="Responsiveness_RICR_form_File.CSS">
</head>
<body>

    <header id="header">
      <h1> RICR </h1>

      <div class="head">
        <span> Home </span>
        <span> About </span>
        <span> Courses </span>
        <span> IDE </span>
        <span> Fees </span>
      </div>

      <div class="head">
        <p> +91-8461944038 </p>
        <button> Student Login </button>
      </div>
    </header>

    <div id="main">

    <center>
    <h1> Enquiry Form </h1> <br>
    <p>
        Have questions or need assistance? Fill out the form below to connect with our team and explore your opportunities.
    </p>
    </center>

    <br><br>

    <div id="personalDeatails">
        <div class="personal1">
        <label> Person Name* </label>
        <input type="text" placeholder="Person Name"> <br>

        <label> Contact Number* </label>
        <input type="text" placeholder="Contact Number">
        </div>

        <div class="personal2"> 
        <label> Email* </label>
        <input type="email" placeholder="Email"> <br>
     
        <label> Qualification* </label>
        <select>
            <option> --Select-- </option>
            <option> 10th Pass </option>
            <option> 12th Pass </option>
            <option> School </option>
            <option> College </option>
            <option> Other </option>
        </select>
        </div>
    </div> <!-- personalDeatails id wala div -->

    <br>

    <div id="eduDetails">

        <div class="clgName">
        <label> College/School Name* </label>  <br><br>
        <input type="text" placeholder="College/School Name">
        </div>
   
        <div class="eduDetailsInnerDiv">
        <label> Year </label> <br><br>
        <select>
        <option> Year </option> <br><br>
        <option> 1st Year </option>
        <option> 2nd Year </option>
        <option> 3rd Year </option>
        <option> 4th Year </option>
        </select>
   
        <label> Branch* </label> <br><br>
        <select>
        <option> --Select-- </option>
        <option> CSE - AIML </option>
        <option> CSE Core </option>
        <option> CSR - AIDS </option>
        <option> EC </option>
        <option> Mechanical </option>
        </select> 
        </div>  <!-- educationDetailsInnerDiv class wala div -->
    </div> <!-- educationDetails id wala div -->

    <div id="otherDiv">

    <div class="course">
    <label> Interested in Which Course* </label> <br>
    <label> <input type="checkbox"> Full Stack Web Development </label> <br>
    <label> <input type="checkbox"> Data Science with Python </label> <br>
    <label> <input type="checkbox"> Data Analytics with Python </label> <br>
    <label> <input type="checkbox"> Business Analyst </label> <br>
    <label> <input type="checkbox"> Java Programming </label> <br>
    <label> <input type="checkbox"> Python Programming </label> <br>
    <label> <input type="checkbox"> C/C++ Programming </label> <br>
    <label> <input type="checkbox"> Other </label> <br>
    </div> <!-- course class wala div -->

    <div class="sourceofInfo">
    <label> Source of Information <br> (Only Choose "Recieved call from institue" if you actually got a call from us) </label> <br>
    <select>
        <option> Source of Information </option>
        <option> Google </option>
        <option> Friend </option>
        <option> Insta </option>
        <option> Other </option>
    </select>
    </div> <!-- sourceofInfo class wala div -->

    <br><br>

    <label> Name of Executive* </label> <br>
    <select>
        <option> Name of Executive </option>
        <option> Executive 1 </option>
        <option> Executive 2 </option>
    </select>
    </div> <!-- otherDiv id wala div -->

    
 
    <button type="submit"> Submit </button>

    </div>  <!-- main id wala div -->

   
</body>
</html>
