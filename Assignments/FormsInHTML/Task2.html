<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Task-2</title>
</head>
<body>
    
    <div style="width:400px; padding:30px; border:2px solid black; margin:auto;">
    <h1> Pizza Order Form </h1>

    <b> First Name: </b> <input type="text"> <br><br>
    <b> Last Name: </b> <input type="text"> <br><br>
    <b> Email Address: </b> <input type="email"> <br><br>
    <b> Contact Number: </b> <input type="number"> <br><br>
    <b> Prefered Delivery Date: </b> <input type="date"> <br>

    <h4> Size: </h4>
    <input type="radio" name="size">
    <label for="size"> Small </label>

    <input type="radio" name="size">
    <label for="size"> Medium </label>

    <input type="radio" name="size">
    <label for="size"> Large </label>

    <h4> Flavour: </h4>
    <input type="checkbox" name="Flavour">
    <label for="Flavour"> Hawaiian(Php 150) </label>

    <select name="Qty" id="Quantity"> 
        <option value="1"> 1 </option>
        <option value="2"> 2 </option>
        <option value="3"> 3 </option>
        <option value=""> </option>
    </select>

    <br>

    <input type="checkbox" name="Flavour">
    <label for="Flavour"> Pepperoni(Php 140) </label>

    <select name="Qty" id="Quantity"> 
        <option value="1"> 1 </option>
        <option value="2"> 2 </option>
        <option value="3"> 3 </option>
        <option value=""> </option>
    </select>

    <br>

    <input type="checkbox" name="Flavour">
    <label for="Flavour"> Vegetables(Php 130) </label>

    <select name="Qty" id="Quantity"> 
        <option value="1"> 1 </option>
        <option value="2"> 2 </option>
        <option value="3"> 3 </option>
        <option value=""> </option>
    </select>

    <br><br>

    <b> Credit Card Number: </b> <input type="number"> <br><br>
    <b> PIN: </b> <input type="number"> <br><br>

    <b> Additional Notes: </b> <br>
    <textarea name="notes" id="notes"> </textarea> 

    <br><br>

    <button> Submit Order </button>


</body>
</html>
