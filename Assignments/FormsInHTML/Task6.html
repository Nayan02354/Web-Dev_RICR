<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Task-6</title>
</head>
<body>

    <div align="center" style="width:500px; padding:30px; border:2px solid black; margin:auto;">

        <h2>Doctor Appointment Form</h2>
        <hr color="red">

        <form>

            <table>
                <tr>
                    <td> <img src="Doctor img.avif" width="250" alt="Doctor Image"> </td>
                    <td width="60%" valign="top"> </td>
                </tr>
            </table>

            <table>

                <tr>
                    <td> Appointment Date </td>
                    <td> <input type="date" name="date"> </td>
                </tr>

                <tr>
                    <td> Appointment Time </td>
                    <td> <input type="time" name="time"> </td>
                </tr>

                <br><br>

                <tr>
                    <td> Name </td>
                    <td>
                        <input type="text" name="first_name" placeholder="First Name">
                        <input type="text" name="last_name" placeholder="Last Name">
                    </td>
                </tr>

                <tr>
                    <td> Gender </td>
                    <td>
                        <input type="radio" name="gender" id="male">
                        <label for="male"> Male </label>

                        <input type="radio" name="gender" id="female">
                        <label for="female"> Female </label>
                    </td>
                </tr>

                <tr> 
                    <td> Phone </td>
                    <td> <input type="number" name="phone"> </td>
                </tr>

                <tr>
                    <td> Address </td>
                    <td>
                        <select name="city">
                            <option value=""> City </option>
                            <option> Bhopal </option>
                            <option> Jabalpur </option>
                            <option> Indore </option>
                        </select>

                        <select name="state">
                            <option value=""> State </option>
                            <option> Madhya Pradesh </option>
                            <option> Maharashtra </option>
                            <option> Rajasthan </option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td> Your Query </td>
                    <td>
                        <textarea name="query"> </textarea>
                    </td>
                </tr>

                <tr>
                    <td> Appointment Type </td>
                    <td> Select which appointment type you require </td>
                </tr>

                <tr>
                    <td> </td>
                    <td>
                        <input type="checkbox" name="cervix">
                        <label for=""> Cervix Checkup </label>
                    </td>
                </tr>

                <tr>
                    <td> </td>
                    <td>
                        <input type="checkbox" name="heart">
                        <label for=""> Heart Checkup </label>
                    </td>
                </tr>

                <tr>
                    <td> </td>
                    <td>
                        <input type="checkbox" name="eye">
                        <label for=""> Eye Checkup </label>
                    </td>
                </tr>

                <tr>
                    <td> </td>
                    <td>
                        <input type="checkbox" name="hearing">
                        <label for=""> Hearing Test </label>
                    </td>
                </tr>

            </table>

            <br>
            <button type="submit"> Send </button>

        </form>

    </div>

</body>
</html>
