<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RICR Form Example</title>
</head>
<body>

    <center> <h1> RICR Form </h1> </center>

    <form action="">

        <label for=""> Name: </label>
        <input type="text" id="name"> <br><br>

        <label for=""> College Name </label>
        <input type="text"> <br><br>

        Branch:
        <input type="text"> <br><br>

        Course:
        <select name="course" id="course"> 
        <option value=""> --Select-- </option>
        <option value="btech"> B.Tech </option>
        <option value="bcom"> B.Com </option>
        <option value="bca"> B.C.A </option>
        <option value="bba"> B.B.A </option>
        </select> <br><br>

        <label for=""> Year: </label>
        <input type="number"> <br><br>

        <label for="> Phone: </label>
        <input type="number">

        <label for=""> Address: </label>
        <input type="text"> <br><br>

        <label for=""> Parent's Contact Number: </label>
        <input type="number"> <br><br>

        <label for=""> Interested Course: </label>
        <select name="interested course" id="interested-course"> 
        <option value=""> --Select-- </option>
        <option value="java+dsa"> Java + DSA </option>
        <option value="python+dsa"> Python + DSA </option>
        <option value="full mern stack+aptitude"> Full MERN Stack + Aptitude </option>
        <option value="data analytics"> Data Analytics </option>
        </select>

        <fieldset> 
            <input type="text" value="Nayan">
            <legend align="center"> Student Information</legend> 
        </fieldset>

        <fieldset>
            <img src="flower.jpg" alt=""   width="200" height="200"> 
        </fieldset>


    </form>
    
</body>
</html>
