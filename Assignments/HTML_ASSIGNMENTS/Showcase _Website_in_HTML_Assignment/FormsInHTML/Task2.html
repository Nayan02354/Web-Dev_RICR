<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Task-2</title>
</head>
<body>
    
    <div style="width:600px; padding:30px; border:2px solid black; margin:auto;">
    <h1> Pizza Order Form </h1>

    <div>

    <b> <label for="first-name"> First Name: </label> </b> <input type="text" id="first-name"> <br><br>
    <b> <label for="last-name"> Last Name: </label> </b> <input type="text" id="last-name"> <br><br>
    <b> <label for="email"> Email Address: </label> </b> <input type="email" id="email"> <br><br>
    <b> <label for="contact-number"> Contact Number: </label> </b> <input type="number" id="contact-number"> <br><br>
    <b> <label for="delivery-date"> Prefered Delivery Date: </label> </b> <input type="date" id="delivery-date"> <br>

    </div>

    <div>

    <h3> <label for="size">Size: </label> </h3>
    <input type="radio" name="size" id="small">
    <label for="small"> Small </label>

    <input type="radio" name="size" id="medium">
    <label for="medium"> Medium </label>

    <input type="radio" name="size" id="large">
    <label for="large"> Large </label>

    </div>

    <div>

    <h4> Flavour: </h4>

    <div>
        
    <input type="checkbox" name="Flavour">
    <label for="Flavour"> Hawaiian(Php 150) </label>

    <select name="Qty" id="Quantity"> 
        <option value="1"> 1 </option>
        <option value="2"> 2 </option>
        <option value="3"> 3 </option>
        <option value=""> </option>
    </select>

    </div>

    <br>

    <div>

    <input type="checkbox" name="Flavour">
    <label for="Flavour"> Pepperoni(Php 140) </label>

    <select name="Qty" id="Quantity"> 
        <option value="1"> 1 </option>
        <option value="2"> 2 </option>
        <option value="3"> 3 </option>
        <option value=""> </option>
    </select>

    </div>

    <br>

    <div>

    <input type="checkbox" name="Flavour">
    <label for="Flavour"> Vegetables(Php 130) </label>

    <select name="Qty" id="Quantity"> 
        <option value="1"> 1 </option>
        <option value="2"> 2 </option>
        <option value="3"> 3 </option>
        <option value=""> </option>
    </select>

    </div>

    </div>

    <br><br>

    <div>

    <b> <label for="credit-card-number"> Credit Card Number: </label> </b> <input type="number" id="credit-card-number"> <br><br>
    <b> <label for="pin"> PIN: </label> </b> <input type="number" id="pin"> <br><br>

    <b> <label for="notes"> Additional Notes: </label> </b> <br>
    <textarea name="notes" id="notes"> </textarea> 

    <br><br>

    <button type="submit"> <label for="submit-order">Submit Order</label> </button>

    </div>

    </div>

    <br><br>

        <a href="./Basic HTML SubIndex.html"> Back </a>
    </center>

</body>
</html>
