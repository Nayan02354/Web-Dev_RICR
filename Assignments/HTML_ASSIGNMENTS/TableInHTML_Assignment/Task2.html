<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Task-2</title>
</head>
<body>

    <u> TASK-2 </u>

    <style>
    table { margin: auto; }
    th, td { 
    text-align: center; 
    vertical-align: middle; 
    }
    </style>

    <table border="5" cellspacing="2">

        <th colspan="6"> Athletics Day Time - Table </th>
    </tr>

    <tr>

        <th> 1pm-2pm </th>
        <th> 2pm-3pm </th>

    <tr>
        <td rowspan="2"> <b> Track </b> </td>
        <td> 400m </td>
        <td> 200m </td>
        <td align="center" rowspan="4"> <b> Lunch </b>  </td>
        <td> 800m </td>
        <td> 100m </td>
    </tr>

    <tr>
        <td> Hurdle </td>
        <td> 1500m </td>
        <td> Free </td>
        <td> 80m </td>
    </tr>

    <tr>
        <td> <b> Field </b> </td>
        <td> Javelin </td>
        <td> Discuss </td>
        <td> Shot Put </td>
        <td> Hammer Throw </td>
    </tr>

    </table>
     
</body>
