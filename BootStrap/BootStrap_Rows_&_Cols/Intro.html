<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> BootStrap Rows & Cols </title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Internal CSS -->
    <style>
        div{
            border: 2px solid black; 
        }
    </style>

</head>
<body>

    <h1> <i class="bi bi-wifi-2 text-danger"> </i> This is Header </h1>

    <hr><hr color="yellow">

    <div class="row">
    <div class="col"> ABCD </div>
    <div class="col"> EFGH </div>
    <div class="col"> IJKL </div>
    <div class="col"> MNOP </div>

    <hr color="black" size="5" width="100%">
    
    <div class="row"> ABCE </div>
    <div class="col"> EFGH </div>
    <div class="col"> IJKL </div>
    <div class="col-5"> MNOP </div>
    <div class="col"> IJKL </div>
    <div class="col"> IJKL </div>

    <hr><hr>

    <div class="row2"> ABC </div>
    <div class="col"> ABC </div>
    <div class="col"> ABC </div>
    <div class="col"> ABC </div>
    <div class="col"> ABC</div>


    
    









 
    <!-- Jo bhi kch likhoge iske upar hee likhna , neecha nhi likhna glti se bhi -->

      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

</body>
</html>
