<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Color Gradient </title>
    <link rel="stylesheet" href="Style.CSS">
</head>
<body>

    <style>
        #abcd{
            border: 5px solid black;
            width: 600px;
            height: 500px;
            justify-content: center;
            align-items: center;
            display: flex;
            background: linear-gradient(45deg, red 0%, green 50%, yellow 100%);
            background: url(./Flower\ img.jpg) no-repeat center center;
            background-size: cover;  
            
        span{
            font-size: xx-large;
            font-weight: bold;
            }
        }
    </style>


    <div id="abcd"> 
        <span> ABCD </span>
    </div>


</body>
</html>
