    <header class="text-center bg-danger border-3"> INSTITUTE REGISTRATION FORM </header>


    <div id="personalInfo" class="d-flex">
        <form id="personalInfoForm">
            <label for=""> Full Name : </label> <input type="text" id="fullName" placeholder="Enter your full Name ">
            <label for=""> Phone Number : </label> <input type="email" id="email" placeholder="Enter your Email ">
            <label for=""> Email ID : </label> <input type="number" id="phone" placeholder="Enter your Phone ">
            <label for=""> Date of Birth : </label> <input type="date" id="DOB" placeholder="Enter your D.O.B ">
            <label for=""> Gender :
            </label> <input type="radio">
                <span> Male </span>
            </label> <input type="radio">
                <span> Female </span>
        </form>
    </div>

    <div id="academicDetails">
        <label for=""> Last Completed Qualification : </label>
        <select name="qualification" id="qualification">
            <option value=""> --Select-- </option>
            <option value="10"> 10th </option>
            <option value="12"> 12th </option>
            <option value="Graduate"> Gradute </option>
            <option value="PG"> Post Graduate </option>
        </select>

        <label for=""> Percentage/Grade in Last Qualification : </label>
        <select name="qualification" id="qualification">
            <option value=""> --Select-- </option>
            <option value="E"> 50% - 60% </option>
            <option value="D"> 60% - 70% </option>
            <option value="C"> 70% - 80% </option>
            <option value="B"> 80% - 90% </option>
            <option value="A"> 90% - 100% </option>
        </select>
    </div>

    <div id="selectCourse">
        <label for=""> Preffered Course : </label>
        <select name="qualification" id="qualification">
            <option value=""> --Select-- </option>
            <option value=""> Java + DSA </option>
            <option value=""> Python + DSA </option> 
            <option value=""> Full Stack Web Development </option>
            <option value=""> Business Analyst </option>
            <option value=""> Data Science with Python </option>
            <option value=""> Data Analytics with Python </option>
            <option value=""> AIML </option>
        </select>
    </div>

    <div id="batchTiming">
        <label for=""> Batch Timing Preference : </label>
        <select name="batchTime" id="batchTie">
            <option value=""> --Select-- </option>
            <option value=""> Moring </option>
            <option value=""> Afternoon </option>
            <option value=""> Evening </option>
            <option value=""> Night </option>
        </select>
    </div>

    <div id="residentalDetaild">
        <input type="text" id="address" placeholder="Enter Address">
        <input type="text" id="city" placeholder="Enter City">
        <input type="text" id="pincode" placeholder="Enter Pincode">      
    </div>

    <div id="guardianDetails">
        <input type="text" id="GuardianFullName" placeholder="Guardian Full Name">
        <input type="number" id="GuardianPhonee" placeholder="Guardian Phone Number">
    </div>

    <div id="addtionlInfo">
        <label for=""> How did you hear about us? : </label>
        <select name="" id="">
        <option value=""> --Select-- </option>
        <option value=""> Instagram </option>
        <option value=""> AD </option>
        <option value=""> Newspaper </option>
        <option value=""> Friends </option>
        <option value=""> Others </option>
        </select>

        <label for=""></label>


    </div>

    


      Required; options such as Friends, Online Ad, Newspaper, Social Media, or Other.
