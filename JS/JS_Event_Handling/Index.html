<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> JS Event Handling </title>
    <link rel="stylesheet" href="JS_Event_Handling_File.CSS">
</head>
<body>
    
    <div id="bulb1">
        Bulb
    </div>


    <button id="buttonON" onclick = "Bulb1ON()"> ON </button>
    <button id="buttonOFF" onclick="Bulb1OFF()"> OFF </button>

    <!-- By using On Click
    <button id="buttonON" onclick = "Bulb1Red()"> Red </button>
    <button id="buttonOFF" onclick="Bulb1Blue()"> Blue </button>
    <button id="buttonON" onclick = "Bulb1Green()"> Green </button> -->


    <!-- By using Event Handling-->
    <button id="bulbRed"> Red </button>
    <button id="bulbBlue"> Blue </button>
    <button id="bulbGreen"> Green </button>

    <br><br>

    <input type="color" id="bulbColor">


    <h1 id="abcd">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Adipisci, ratione?
    </h1>

    <button onclick="reset()"> Reset </button>
   
     
    


    <script src="JS_Event_Handling_Script.JS"></script>
</body>
</html>
