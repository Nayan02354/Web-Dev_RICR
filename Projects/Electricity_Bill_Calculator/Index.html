<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> Electricity Bill Calculator Mini Project </title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="Electricity_Bill_Calculator_File.CSS" />
  </head>
  <body>

    <div id="mainDiv" class="m-auto">
    <div id="head">
      <h1 class="text-center"> Electricity Bill Calculator </h1>
    </div>

    <div id="form" class="m-auto">
      <form >
        <label for="units"> Enter Electricity Units </label>

        <input
          type="number"
          id="units"
          class="form-control mb-3"
          placeholder="Enter Units"
          min="1"
        />

        <div class="d-flex gap-3">
          <button type="submit" class="btn btn-primary w-100"> Calculate </button>

          <button type="button" id="resetBtn" class="btn btn-danger"> Reset </button>

        </div>
      </form>
      </div>
      <div class="card mt-4 p-3" id="resultCard">
        <h3 class="text-center mb-3">Bill Details</h3>

        <div id="result"> Enter units to calculate bill. </div>
      </div>
    </div>



    <!-- Jo bhi kch likhoge iske upar hee likhna , neecha nhi likhna glti se bhi -->
    <!-- BootStrap Script -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="Electricity_Bill_Calculator_Script.JS"></script>
  </body>
</html>
