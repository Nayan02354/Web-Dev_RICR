<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> Guessing Number Mini Project </title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"

  </head>
  <body>

    <div class=" bg-light rounded shadow border mx-auto mt-5 m-4 p-2">
      <h1> Guess the Number </h1> <br>

      <form>
        <label for="selectNo"> We have selected a random number between 1 - 10. See if you can guess it. </label>

        <br><br>

        <label for="takeGuess">  Enter a guess : </label>
        <input type="number" name="numbeer" id="number">
        <button type="submit"> Submit guess </button>
      </form>

    </div>
