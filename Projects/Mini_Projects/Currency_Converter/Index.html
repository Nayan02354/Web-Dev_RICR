<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter Mini Project</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="Currency_Exhanger_File.CSS" />
  </head>
  <body>
    <header class="bg-dark text-white text-center py-3 shadow-sm">
      <h2 class="m-0">Currency Converter</h2>
    </header>

    <div id="main" class="container mt-5 p-4 shadow rounded">
      <div class="row justify-content-center align-items-center g-4">
        <div class="col-md-5">
          <label class="form-label fw-bold text-white"> From </label>

          <div
            class="cont d-flex align-items-center gap-3 p-3 border rounded bg-white"
          >
            <span class="flag">
              <img id="flagImg1" src="" width="70" alt="Country Flag" />
            </span>

            <div class="w-100">
              <select
                id="Country1"
                class="form-select mb-2"
                onchange="FetchFlg1()"
              >
                <option value="select">-- Select Country --</option>
              </select>

              <input
                type="number"
                id="amount"
                class="form-control"
                placeholder="Enter amount"
              />
            </div>
          </div>
        </div>

        <div class="col-md-1 text-center">
          <button
            class="btn btn-primary rounded-circle p-3"
            onclick="convert()"
          >
            <i class="bi bi-arrow-left-right fs-4"></i>
          </button>
        </div>

        <div class="col-md-5">
          <label class="form-label fw-bold text-white"> To </label>

          <div
            class="cont d-flex align-items-center gap-3 p-3 border rounded bg-white"
          >
            <span class="flag">
              <img id="flagImg2" src="" width="70" alt="Country Flag" />
            </span>

            <div class="w-100">
              <select id="Country2" class="form-select" onchange="FetchFlg2()">
                <option value="select">-- Select Country --</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Result Box -->
      <div class="row mt-5">
        <div class="col-12">
          <div class="result-box text-center p-4 rounded shadow-sm">
            <h5 class="mb-2 text-danger">Converted Amount</h5>

            <h2 id="result" class="fw-bold text-danger">₹0.00</h2>
          </div>
        </div>
      </div>
    </div>

    <!-- Jo bhi kch likhoge iske upar hee likhna , neecha nhi likhna glti se bhi -->
    <!-- BootStrap Script -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="Currency_Exhanger_Script.JS"></script>
  </body>
</html>
