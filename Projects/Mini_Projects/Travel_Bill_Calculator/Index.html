<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Bill Calculator Mini Project</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="Travel_Bill_Calculator_File.CSS" />
  </head>
  <body>
    <div id="main" class="m-auto">

      <div id="forms" class="w-75 m-auto pt-4">

        <div id="head" class="border rounded-3 text-center">
          <h2> Travel Bill Calculator </h2>
        </div>
        <form
          action=""
          class="bg-white border rounded-3 shadow mt-3 p-5 d-flex flex-column gap-3"
        >
          <label for="kmCovered"> Kilometers covered </label>
          <input type="number" class="form-control" id="totalKm" class="InputBox" />

          <div>
            <button
              type="submit"
              class="btn btn-info border rounded-3 mb-4 mt-2"
            >
              Calculate
            </button>
            <button
              type="reset"
              class="btn btn-info border rounded-3 mb-4 mt-2"
            >
              Reset
            </button>
          </div>
          <div class="text-center d-flex flex-column m-auto">
            <div class="fw-bold"> Total Bill : <span id="Km"> XX U  </span></div>
            <div class="fw-bold">
              Calculation Breakdown: <span id="Breakdown"> XX ₹</span>
            </div>

            <div class="fw-bold">
              Total Bill: <span id="totalBill"> XX ₹ </span>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Jo bhi kch likhoge iske upar hee likhna , neecha nhi likhna glti se bhi -->
    <!-- BootStrap Script -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="Travel_Bill_Calculator_Script.JS"></script>
  </body>
</html>
