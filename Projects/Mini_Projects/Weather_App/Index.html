<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App Mini Project</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="Weather_App_File.CSS" />
  </head>
  <body>
    <header class="p-3 text-center border shadow rounded-2 text-dark">
      🌤️Weather App
    </header>
    <div id="main" class="container w-50 shadow rounded-3 p-2 mt-5">
      <div class="container border shadow rounded-2 pb-2">
        <div class="d-flex">
          <input
            type="text"
            id="cityName"
            class="form-control mt-3"
            placeholder="Enter your City Name"
          />
          <button onclick="getWeather()" class="btn btn-primary ms-3">
            Get Weather
          </button>
        </div>
      </div>
      <br />

      <div class="m-auto ms-5 p-5">
        <div class="container d-flex gap-5">
          <div class="wetcon text-center">
            <label class="mt-4"
              >Temp : <span id="Temperature">00</span>ºC 🌡️</label
            >
          </div>
          <div class="wetcon text-center">
            <label class="mt-4">Humidity : <span id="Humidity">00</span></label>
          </div>
        </div>
        <div class="container mt-5 d-flex gap-5">
          <div class="wetcon mt-3 text-center">
            <label class="mt-4"
              >Min Temperature : <span id="minTemp">00</span>ºC
            </label>
          </div>
          <div class="wetcon mt-3 text-center">
            <label class="mt-4">
              Max Temperature : <span id="maxTemp">00</span></label
            >
          </div>
        </div>
      </div>
    </div>

    <!-- Jo bhi kch likhoge iske upar hee likhna , neecha nhi likhna glti se bhi -->
    <!-- BootStrap Script -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="Weather_App_Script.JS"></script>
  </body>
</html>
