<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> Tip Calculator Mini Project </title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="Tip_Caclulator_File.CSS" />
  </head>
  <body>

    <div id="main" class="m-auto">
    <div class="head" class="border rounded-3 shadow mt-3 p-3">
      <h1 class="text-center"> TIP CALCULTOR </h1>
    </div>

<form class="p-3 m-3">

  <label for="billAmt"> Bill Amount </label> <br>

  <input
    type="number"
    id="billAmt"
    class="form-control mb-3"
  />

  <br>

  <label for="serviceFeedback"> How was the Service ? </label> <br>

  <select
    name="serviceFeedback"
    id="serviceFeedback"
    class="form-select mb-3"
  >

    <option value=""> --Select-- </option>

    <option value="25"> 25% - Top Notch </option>

    <option value="20"> 20% - Excellent </option>

    <option value="15"> 15% - Good </option>

    <option value="10"> 10% - Bad </option>

    <option value="5"> 5% - Worst </option>

  </select>

  <br>

  <label for="totalPerson"> Total No of Persons </label> <br>

  <input
    type="number"
    id="totalPerson"
    class="form-control mb-3"
  />

  <br>

  <button class="btn btn-primary w-100" type="submit">
    Calculate
  </button>

  <h4>  Tip Amount: <span id="tipAmt"> XX </span> </h4>


</form>

</div>

      crossorigin="anonymous"
    ></script>
    <script src="Tip_Caclulator_Script.JS"></script>
  </body>
</html>
